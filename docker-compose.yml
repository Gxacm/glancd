version: '3.8'

services:
  # -------------------------------------------------------------------
  # Frontend (React / Vue / Angular / Node)
  # -------------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000" # Mapea el puerto local 3000 al contenedor
    env_file:
      - ./frontend/.env
    # Opcional: si quieres cambios en vivo (Hot Reloading) en desarrollo
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # -------------------------------------------------------------------
  # Microservicio de Usuarios (Node.js)
  # -------------------------------------------------------------------
  ms-usuarios:
    build: ./ms-usuarios
    container_name: ms-usuarios
    ports:
      - "3001:3001"
    env_file:
      - ./ms-usuarios/.env

  # -------------------------------------------------------------------
  # Microservicio de Libros (FastAPI - Python)
  # -------------------------------------------------------------------
  ms-libros:
    build: ./ms-libros
    container_name: ms-libros
    ports:
      - "8001:8001"
    env_file:
      - ./ms-libros/.env

  # -------------------------------------------------------------------
  # Microservicio de Autores (FastAPI - Python)
  # -------------------------------------------------------------------
  ms-autores:
    build: ./ms-autores
    container_name: ms-autores
    ports:
      - "8002:8002"
    env_file:
      - ./ms-autores/.env