services:
  # -------------------------------------------------------------------
  # Frontend (React / Vue / Angular / Node)
  # -------------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000" # Mapea el puerto local 3000 al contenedor
    env_file:
      - ./frontend/.env
    # Opcional: si quieres cambios en vivo (Hot Reloading) en desarrollo
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Microservicio de Usuarios (Node.js)
  # -------------------------------------------------------------------
  ms-usuarios:
    build: ./ms-usuarios
    container_name: ms-usuarios
    ports:
      - "3001:3001"
    env_file:
      - ./ms-usuarios/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Microservicio de Libros (FastAPI - Python)
  # -------------------------------------------------------------------
  ms-libros:
    build: ./ms-libros
    container_name: ms-libros
    ports:
      - "8001:8001"
    env_file:
      - ./ms-libros/.env
    depends_on:
      ms-autores:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Microservicio de Autores (FastAPI - Python)
  # -------------------------------------------------------------------
  ms-autores:
    build: ./ms-autores
    container_name: ms-autores
    ports:
      - "8002:8002"
    env_file:
      - ./ms-autores/.env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

      # -------------------------------------------------------------------
  # Microservicio de Interacciones (Node.js)
  # -------------------------------------------------------------------
  ms-interacciones:
    build: ./ms-interacciones
    container_name: ms-interacciones
    ports:
      - "8003:8003"
    env_file:
      - ./ms-interacciones/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Microservicio de Reseñas (Node.js)
  # -------------------------------------------------------------------
  ms-resenas:
    build: ./ms-resenas
    container_name: ms-resenas
    ports:
      - "8004:8004"
    env_file:
      - ./ms-resenas/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Microservicio de Recomendaciones (FastAPI)
  # -------------------------------------------------------------------
  ms-recomendador:
    build: ./ms-recomendador
    container_name: ms-recomendador
    ports:
      - "8005:8005"
    env_file:
      - ./ms-recomendador/.env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
